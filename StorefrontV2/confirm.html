<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Baked By Justine</title>

  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/confirm.css">
</head>
<body>

<!-- 
     HEADER / NAV
 -->
<header>
  <nav>
    <a class="logo" href="order.html">Baked By <b>Justine</b></a>
    <div class="nav-right">
      <a class="nav-pill" href="order.html">Order</a>
      <a class="nav-pill" href="#">Track Order</a>
      <a class="nav-pill" href="#">Sign In</a>
      <button class="cart-pill" onclick="window.location.href='order.html'">
        🧺 Cart <span class="badge">0</span>
      </button>
      <button class="hamburger" onclick="toggleMobileNav()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="mobile-nav" id="mobileNav">
    <a href="order.html">Order</a>
    <a href="#">Track Order</a>
    <a href="#">Sign In</a>
  </div>
</header>

     <!-- CONFIRMATION CARD -->

<main class="confirm-wrap">
  <div class="confirm-card">

    <!-- Dark top -->
    <div class="confirm-top">
      <div class="confirm-icon">✓</div>
      <h1>Order Placed!</h1>
      <p>Your order has been submitted. Justine will start preparing your bakes shortly.</p>
    </div>

    <!-- White body -->
    <div class="confirm-body">

      <!-- Status badge -->
      <div class="confirm-badge-row">
        <span class="status-badge">
          <span class="pdot"></span>
          order_status: pending
        </span>
      </div>

      <!-- Order ID -->
      <div class="order-id-box">
        <div class="order-id-label">Order ID - delivery.order_id</div>
        <div class="order-id-val" id="confirmId">…</div>
      </div>

      <!-- Details table — populated by confirm.js -->
      <table class="c-table" id="confirmTable"></table>

      <!-- SQL preview — populated by confirm.js -->
      <div class="sql-block" id="confirmSQL">Loading…</div>

      <!-- Actions -->
      <div class="confirm-actions">
        <button class="btn-tan full" onclick="placeAnother()">
          Place Another Order
        </button>
        <a class="btn-outline full" href="order.html"> Back to Menu</a>
      </div>

    </div>
  </div>
</main>


     <!-- FOOTER -->

<footer>
  <p>Baked By <span>Justine</span> · Hamilton, ON · Made with love! </p>
</footer>

<!-- Scripts -->
<script src="js/products.js"></script>
<script src="js/confirm.js"></script>

<!-- Mobile nav toggle (shared) -->
<script>
  function toggleMobileNav() {
    document.getElementById('mobileNav').classList.toggle('open');
  }
</script>

</body>
</html>
